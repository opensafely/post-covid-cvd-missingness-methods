version: '3.0'

expectations:

  population_size: 5000

actions:

  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## DO NOT EDIT project.yaml DIRECTLY 
  ## This file is created by create_project_actions.R 
  ## Edit and run create_project_actions.R to update the project.yaml 
  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## Define study dates 

  study_dates:
    run: r:latest analysis/study_dates.R
    outputs:
      highly_sensitive:
        study_dates_json: output/study_dates.json

  ## Generate dates for all cohorts 

  generate_dates:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_dates.py
      --output output/dataset_definition/index_dates.csv.gz
    needs:
    - study_dates
    outputs:
      highly_sensitive:
        dataset: output/dataset_definition/index_dates.csv.gz

  ## Generate input_prevax 

  generate_input_prevax:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_prevax.py
      --output output/dataset_definition/input_prevax.csv.gz
    needs:
    - study_dates
    - generate_dates
    outputs:
      highly_sensitive:
        cohort: output/dataset_definition/input_prevax.csv.gz

  ## Generate input_prevax_clean, with describe = FALSE 

  generate_input_prevax_clean:
    run: r:latest analysis/dataset_clean/dataset_clean.R prevax FALSE
    needs:
    - study_dates
    - generate_input_prevax
    outputs:
      moderately_sensitive:
        flow: output/dataset_clean/flow-cohort_prevax.csv
        flow_midpoint6: output/dataset_clean/flow-cohort_prevax-midpoint6.csv
      highly_sensitive:
        venn: output/dataset_clean/venn-cohort_prevax.rds
        cohort_clean: output/dataset_clean/input_prevax_clean.rds

  ## apply_across_MI_cohort_prevax-main-ami 

  apply_across_MI_cohort_prevax-main-ami:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-main-ami
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-main-ami_clean_across_MI.rds

  ## apply_across_MI_cohort_prevax-main-stroke_sahhs 

  apply_across_MI_cohort_prevax-main-stroke_sahhs:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-main-stroke_sahhs
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-main-stroke_sahhs_clean_across_MI.rds

  ## apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-ami 

  apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-ami:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-sub_covidhospital_FALSE-ami
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-sub_covidhospital_FALSE-ami_clean_across_MI.rds

  ## apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs 

  apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs_clean_across_MI.rds

  ## apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-ami 

  apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-ami:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-sub_covidhospital_TRUE-ami
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-sub_covidhospital_TRUE-ami_clean_across_MI.rds

  ## apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs 

  apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs:
    run: r:latest analysis/apply_across_MI/apply_across_MI.R prevax cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs
    needs:
    - generate_input_prevax_clean
    outputs:
      highly_sensitive:
        across_MI_clean_data: output/apply_across_MI/input_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs_clean_across_MI.rds

  ## generate_subsample_cohort_prevax-main-ami 

  generate_subsample_cohort_prevax-main-ami:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-main-ami
    needs:
    - apply_across_MI_cohort_prevax-main-ami
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-main-ami_clean_across_MI_subsample.rds

  ## generate_subsample_cohort_prevax-main-stroke_sahhs 

  generate_subsample_cohort_prevax-main-stroke_sahhs:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-main-stroke_sahhs
    needs:
    - apply_across_MI_cohort_prevax-main-stroke_sahhs
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-main-stroke_sahhs_clean_across_MI_subsample.rds

  ## generate_subsample_cohort_prevax-sub_covidhospital_FALSE-ami 

  generate_subsample_cohort_prevax-sub_covidhospital_FALSE-ami:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-sub_covidhospital_FALSE-ami
    needs:
    - apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-ami
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-sub_covidhospital_FALSE-ami_clean_across_MI_subsample.rds

  ## generate_subsample_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs 

  generate_subsample_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs
    needs:
    - apply_across_MI_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-sub_covidhospital_FALSE-stroke_sahhs_clean_across_MI_subsample.rds

  ## generate_subsample_cohort_prevax-sub_covidhospital_TRUE-ami 

  generate_subsample_cohort_prevax-sub_covidhospital_TRUE-ami:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-sub_covidhospital_TRUE-ami
    needs:
    - apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-ami
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-sub_covidhospital_TRUE-ami_clean_across_MI_subsample.rds

  ## generate_subsample_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs 

  generate_subsample_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs:
    run: r:latest analysis/generate_subsample/generate_subsample.R cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs
    needs:
    - apply_across_MI_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs
    outputs:
      highly_sensitive:
        clean_subsample_across_MI: output/generate_subsample/input_cohort_prevax-sub_covidhospital_TRUE-stroke_sahhs_clean_across_MI_subsample.rds

